<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Contact Chuzosho about products, productisation, and partnership."><title>Contact Us | Chuzosho</title><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/assets/css/site-v3.css?v=20260831-chuzosho-v3"><script type="module" src="/assets/js/site.js?v=20260831-chuzosho-v3"></script></head>
<body class="page-contact"><a class="skip-link" href="#main">Skip to content</a><site-header></site-header><main id="main">
  <section class="contact-stage" style="--contact-bg: url('/assets/images/subscription-stack-original-v1.webp')">
    <div class="section-shell contact-stage__grid">
      <div class="contact-intro" data-reveal>
        <h1>Bring us the need.</h1>
        <p>Talk to Chuzosho about a product, a solution worth productising, or a route to market.</p>
      </div>
      <form class="contact-form contact-form--glass" data-demo-form data-reveal>
      <div class="field"><label for="name">Name</label><input id="name" name="name" autocomplete="name" required></div>
      <div class="field"><label for="email">Work email</label><input id="email" name="email" type="email" autocomplete="email" required></div>
      <div class="field"><label for="company">Company</label><input id="company" name="company" autocomplete="organization"></div>
      <div class="field"><label for="interest">I want to discuss</label><select id="interest" name="interest"><option>Existing product</option><option>Productising a solution</option><option>Partnership</option><option>Other</option></select></div>
      <div class="field field-full"><label for="message">Context</label><textarea id="message" name="message" placeholder="What problem, product, or market should we discuss?" required></textarea></div>
      <div class="consent"><input id="consent" name="consent" type="checkbox" required><label for="consent">CHUZOSHO will use your information in accordance with our <a href="/privacy-policy/">privacy policy</a> and handle it with care wherever it is processed.</label></div>
      <p class="form-status" data-form-status tabindex="-1" hidden></p>
      <div class="field-full"><button class="button button-primary" type="submit">Submit</button></div>
      </form>
    </div>
  </section>
</main><site-footer></site-footer></body></html>
